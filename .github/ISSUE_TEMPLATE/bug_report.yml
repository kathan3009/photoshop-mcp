name: Bug report
description: Report an installation, connection, or Photoshop tool problem
body:
  - type: markdown
    attributes:
      value: Please redact private paths, document names, tokens, and image data. Do not upload complete logs or original photos unless needed and safe to share.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Apple silicon or Intel, Photoshop version, MCP client, Photoshop MCP version, and source or desktop install.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and exact error
      description: What did you try, what happened, and what did you expect? Include sanitized Doctor output if relevant.
    validations:
      required: true
